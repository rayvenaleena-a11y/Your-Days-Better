<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>Your Days Better</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --c1: #e6e6fa; --c2: #ffd1dc; --c3: #b0e0e6;
            --text: #3a3a3a; --text-light: #7a7a7a;
            --glass: rgba(255, 255, 255, 0.45);
            --border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Quicksand', sans-serif; color: var(--text); background: #f8f4ff; height: 100vh; overflow: hidden; }
        
        #bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background-color: var(--c1);
            background-image: 
                radial-gradient(at 10% 20%, var(--c2) 0px, transparent 50%),
                radial-gradient(at 90% 10%, var(--c3) 0px, transparent 50%),
                radial-gradient(at 50% 80%, var(--c1) 0px, transparent 50%),
                radial-gradient(at 80% 90%, var(--c2) 0px, transparent 50%),
                radial-gradient(at 20% 90%, var(--c3) 0px, transparent 50%);
            transition: background 0.8s ease; filter: blur(40px); transform: scale(1.1);
        }

        #app { height: 100%; overflow-y: auto; padding: 20px 15px 100px 15px; scrollbar-width: none; }
        #app::-webkit-scrollbar { display: none; }

        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1, h2, h3 { font-family: 'Comfortaa', cursive; font-weight: 400; }
        .header { font-size: 1.8rem; margin-bottom: 20px; }
        
        /* Glass containers - small, rounded, no big boxes */
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 20px; padding: 15px; margin-bottom: 12px; }
        
        /* FAB */
        .fab { position: fixed; bottom: 100px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid white; box-shadow: var(--shadow); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; display: none; }
        
        /* Bottom Nav */
        #nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 70px; background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; box-shadow: var(--shadow); z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-light); font-size: 0.7rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--text); }
        .nav-item i { margin-bottom: 4px; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .list-item:last-child { border-bottom: none; }
        .back-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--text-light); font-weight: 600; margin-bottom: 20px; cursor: pointer; }
        
        input, textarea, select { width: 100%; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 12px; padding: 12px; font-family: inherit; font-size: 1rem; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; background: rgba(255, 255, 255, 0.8); border: 1px solid white; font-family: 'Comfortaa'; font-weight: bold; cursor: pointer; }
        .slider-container { margin-bottom: 15px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.5); outline: none; padding: 0; margin: 0; }
    </style>
</head>
<body>
    <div id="bg"></div>

    <div id="app">
        <!-- TABS -->
        <div id="tab-mood" class="page active">
            <h1 class="header">Mood</h1>
            <div id="mood-list"></div>
        </div>
        <div id="tab-feelings" class="page">
            <h1 class="header">Feelings</h1>
            <div class="glass"><h3>Pleasant</h3><div id="pleasant-list"></div></div>
            <div class="glass"><h3>Difficult</h3><div id="difficult-list"></div></div>
        </div>
        <div id="tab-journal" class="page">
            <h1 class="header">Journal</h1>
            <div id="journal-list"></div>
        </div>
        <div id="tab-pet" class="page">
            <h1 class="header">Plant</h1>
            <div class="glass" style="text-align:center; padding: 40px 15px;">
                <i data-lucide="sprout" style="width: 80px; height: 80px; color: #4caf50; margin-bottom: 15px;"></i>
                <h3>Day 1</h3>
                <p style="color: var(--text-light); margin-top: 10px;">Log your mood daily to keep it growing.</p>
            </div>
        </div>
        <div id="tab-settings" class="page">
            <h1 class="header">Settings</h1>
            <div class="glass">
                <h3 style="margin-bottom: 15px;">Preset Themes</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div onclick="setTheme('#e6e6fa', '#ffd1dc', '#b0e0e6')" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #e6e6fa, #ffd1dc); cursor: pointer;"></div>
                    <div onclick="setTheme('#e0f2f1', '#c8e6c9', '#b2dfdb')" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #e0f2f1, #c8e6c9); cursor: pointer;"></div>
                </div>
                <h3 style="margin-bottom: 15px;">Custom Gradient</h3>
                <div class="slider-container"><input type="range" id="h1" min="0" max="360" value="270" oninput="customTheme()"></div>
                <div class="slider-container"><input type="range" id="h2" min="0" max="360" value="350" oninput="customTheme()"></div>
                <div class="slider-container"><input type="range" id="h3" min="0" max="360" value="200" oninput="customTheme()"></div>
            </div>
        </div>

        <!-- SUB PAGES -->
        <div id="page-log-mood" class="page">
            <div class="back-btn" onclick="nav('tab-mood')"><i data-lucide="chevron-left"></i> Back</div>
            <h2 class="header">Log Mood</h2>
            <div class="glass">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <i data-lucide="cloud-rain" onclick="selectMood(this)" style="cursor:pointer; width:30px; height:30px; opacity:0.4;"></i>
                    <i data-lucide="cloud" onclick="selectMood(this)" style="cursor:pointer; width:30px; height:30px; opacity:0.4;"></i>
                    <i data-lucide="cloud-sun" onclick="selectMood(this)" style="cursor:pointer; width:30px; height:30px; opacity:0.4;"></i>
                    <i data-lucide="sun" onclick="selectMood(this)" style="cursor:pointer; width:30px; height:30px; opacity:0.4;"></i>
                </div>
                <input type="text" id="mood-note" placeholder="Optional note...">
            </div>
            <button class="btn" onclick="saveMood()">Save</button>
        </div>

        <div id="page-add-feeling" class="page">
            <div class="back-btn" onclick="nav('tab-feelings')"><i data-lucide="chevron-left"></i> Back</div>
            <h2 class="header">Add Feeling</h2>
            <input type="text" id="feel-name" placeholder="Feeling name...">
            <select id="feel-type"><option value="pleasant">Pleasant</option><option value="difficult">Difficult</option></select>
            <button class="btn" onclick="addFeeling()">Save</button>
        </div>

        <div id="page-add-journal" class="page">
            <div class="back-btn" onclick="nav('tab-journal')"><i data-lucide="chevron-left"></i> Back</div>
            <h2 class="header">New Entry</h2>
            <textarea id="journal-text" rows="10" placeholder="Write your thoughts..."></textarea>
            <button class="btn" onclick="saveJournal()">Save Entry</button>
        </div>
    </div>

    <div class="fab" id="fab" onclick="fabAction()"><i data-lucide="plus"></i></div>

    <div id="nav">
        <div class="nav-item active" id="n-mood" onclick="nav('tab-mood')"><i data-lucide="sun"></i><span>Mood</span></div>
        <div class="nav-item" id="n-feelings" onclick="nav('tab-feelings')"><i data-lucide="heart"></i><span>Feelings</span></div>
        <div class="nav-item" id="n-journal" onclick="nav('tab-journal')"><i data-lucide="book-open"></i><span>Journal</span></div>
        <div class="nav-item" id="n-pet" onclick="nav('tab-pet')"><i data-lucide="sprout"></i><span>Plant</span></div>
        <div class="nav-item" id="n-settings" onclick="nav('tab-settings')"><i data-lucide="settings"></i><span>Settings</span></div>
    </div>

    <script>
        lucide.createIcons();

// --- STATE & STORAGE ---
let currentTab = 'tab-mood';
let selectedMoodIcon = null;

// Load data or start fresh
let data = JSON.parse(localStorage.getItem('ydb_data')) || {
    moods: [],
    feelings: [
        {name: 'Cheerful', type: 'pleasant'}, {name: 'Calm', type: 'pleasant'},
        {name: 'Sad', type: 'difficult'}, {name: 'Anxious', type: 'difficult'}
    ],
    journals: []
};

function save() { localStorage.setItem('ydb_data', JSON.stringify(data)); }

// --- NAVIGATION ---
function nav(pageId) {
    // Hide all pages
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    // Show target
    document.getElementById(pageId).classList.add('active');

    // Handle Nav Bar & FAB
    if (pageId.startsWith('tab-')) {
        currentTab = pageId;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('n-' + pageId.split('-')[1]).classList.add('active');
        document.getElementById('fab').style.display = 'flex';
    } else {
        document.getElementById('fab').style.display = 'none'; // Hide FAB on forms
    }
    
    render();
}

function fabAction() {
    if (currentTab === 'tab-mood') nav('page-log-mood');
    else if (currentTab === 'tab-feelings') nav('page-add-feeling');
    else if (currentTab === 'tab-journal') nav('page-add-journal');
}

// --- RENDER DATA ---
function render() {
    // 1. Mood List
    document.getElementById('mood-list').innerHTML = data.moods.map(m => `
        <div class="glass list-item">
            <div><i data-lucide="${m.icon}" style="width:20px; margin-right:10px;"></i>${m.note || 'No note'}</div>
        </div>
    `).join('') || '<p style="color:var(--text-light); text-align:center; margin-top:20px;">No moods logged yet.</p>';

    // 2. Feelings
    document.getElementById('pleasant-list').innerHTML = data.feelings.filter(f => f.type === 'pleasant').map(f => `<div class="list-item">${f.name}</div>`).join('');
    document.getElementById('difficult-list').innerHTML = data.feelings.filter(f => f.type === 'difficult').map(f => `<div class="list-item">${f.name}</div>`).join('');

    // 3. Journal
    document.getElementById('journal-list').innerHTML = data.journals.map(j => `
        <div class="glass"><p>${j.text}</p></div>
    `).join('') || '<p style="color:var(--text-light); text-align:center; margin-top:20px;">No entries yet.</p>';

    lucide.createIcons(); // Re-initialize icons after rendering HTML
}

// --- ACTIONS ---

// Mood
function selectMood(el) {
    document.querySelectorAll('#page-log-mood i').forEach(i => i.style.opacity = '0.4');
    el.style.opacity = '1';
    selectedMoodIcon = el.getAttribute('data-lucide');
}

function saveMood() {
    if (!selectedMoodIcon) return alert('Please select a mood icon first.');
    const note = document.getElementById('mood-note').value;
    data.moods.unshift({ icon: selectedMoodIcon, note: note });
    save();
    document.getElementById('mood-note').value = '';
    selectedMoodIcon = null;
    nav('tab-mood'); // Go back
}

// Feelings
function addFeeling() {
    const name = document.getElementById('feel-name').value;
    const type = document.getElementById('feel-type').value;
    if (!name) return;
    data.feelings.push({ name, type });
    save();
    document.getElementById('feel-name').value = '';
    nav('tab-feelings');
}

// Journal
function saveJournal() {
    const text = document.getElementById('journal-text').value;
    if (!text) return;
    data.journals.unshift({ text });
    save();
    document.getElementById('journal-text').value = '';
    nav('tab-journal');
}

// Settings & Themes
function setTheme(c1, c2, c3) {
    document.documentElement.style.setProperty('--c1', c1);
    document.documentElement.style.setProperty('--c2', c2);
    document.documentElement.style.setProperty('--c3', c3);
}

function customTheme() {
    const h1 = document.getElementById('h1').value;
    const h2 = document.getElementById('h2').value;
    const h3 = document.getElementById('h3').value;
    setTheme(`hsl(${h1}, 70%, 85%)`, `hsl(${h2}, 70%, 85%)`, `hsl(${h3}, 70%, 85%)`);
}

// --- INITIAL LOAD ---
render();
document.getElementById('fab').style.display = 'flex';
    </script>
</body>
</html>
