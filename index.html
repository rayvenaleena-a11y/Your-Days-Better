<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8f4ff">
    <title>Your Days Better</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Link to PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Dreamy Mesh Gradient Defaults */
            --color-1: #e6e6fa; /* Lavender */
            --color-2: #ffd1dc; /* Pastel Pink */
            --color-3: #b0e0e6; /* Powder Blue */
            --text-dark: #3a3a3a;
            --text-light: #7a7a7a;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: var(--text-dark);
            background-color: #f8f4ff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* The Cloudy/Helichrome Mesh Gradient Background */
        #mesh-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background-color: var(--color-1);
            background-image: 
                radial-gradient(at 10% 20%, var(--color-2) 0px, transparent 50%),
                radial-gradient(at 90% 10%, var(--color-3) 0px, transparent 50%),
                radial-gradient(at 50% 80%, var(--color-1) 0px, transparent 50%),
                radial-gradient(at 80% 90%, var(--color-2) 0px, transparent 50%),
                radial-gradient(at 20% 90%, var(--color-3) 0px, transparent 50%);
            transition: background 0.8s ease;
            filter: blur(40px);
            transform: scale(1.1); /* Prevents white edges from blur */
        }

        /* Main Container */
        #app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 15px 100px 15px; /* Bottom padding for nav */
            overflow-y: auto;
            scrollbar-width: none; /* Hide scrollbar */
        }
        #app-container::-webkit-scrollbar { display: none; }

        /* Pages */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
            flex: 1;
        }
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1, h2, h3 { font-family: 'Comfortaa', cursive; font-weight: 400; }
        .header-title { font-size: 1.8rem; margin-bottom: 20px; }

        /* Glassmorphism Containers (No giant rigid boxes) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
        }

        /* Floating Action Button (The "+" Button) */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s;
            z-index: 100;
        }
        .fab:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.9); }

        /* Back Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 20px;
            cursor: pointer;
        }

        /* Bottom Navigation */
        #bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: var(--glass-shadow);
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
            font-size: 0.7rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-item.active { color: var(--text-dark); }
        .nav-item i { margin-bottom: 4px; }

        /* List Items inside Tabs */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }

        /* Forms */
        input[type="text"], textarea {
            width: 100%;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            outline: none;
        }
        input:focus, textarea:focus { background: rgba(255,255,255,0.8); }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid white;
            font-family: 'Comfortaa', cursive;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- The Dreamy Background -->
    <div id="mesh-background"></div>

    <div id="app-container">
        
        <!-- ================= MOOD TAB ================= -->
        <div id="tab-mood" class="page active">
            <h1 class="header-title">Your Days Better</h1>
            <p style="margin-bottom: 20px; color: var(--text-light);">How are you feeling right now?</p>
            
            <div id="mood-list-container">
                <!-- Mood logs will appear here -->
            </div>
        </div>

        <!-- ================= MOOD - LOG PAGE (Hidden by default) ================= -->
        <div id="page-log-mood" class="page">
            <div class="back-btn" onclick="navigate('tab-mood')">
                <i data-lucide="chevron-left"></i> Back to Mood
            </div>
            <h2 style="margin-bottom: 20px;">Log Your Mood</h2>
            
            <div class="glass-card" style="text-align: center;">
                <!-- Example of icons instead of emojis -->
                <div style="display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 1.5rem;">
                    <i data-lucide="cloud-rain"></i>
                    <i data-lucide="cloud"></i>
                    <i data-lucide="cloud-sun"></i>
                    <i data-lucide="sun"></i>
                </div>
                <input type="text" id="mood-note" placeholder="Add a short note...">
            </div>
            <button class="btn-primary" onclick="saveMood()">Save Mood</button>
        </div>

        <!-- ================= FEELINGS TAB ================= -->
        <div id="tab-feelings" class="page">
            <h1 class="header-title">Feelings</h1>
            <p style="margin-bottom: 20px; color: var(--text-light);">Your emotional balance.</p>

            <div class="glass-card">
                <h3 style="margin-bottom: 10px;">Pleasant</h3>
                <div id="pleasant-feelings"></div>
            </div>
            
            <div class="glass-card">
                <h3 style="margin-bottom: 10px;">Difficult</h3>
                <div id="difficult-feelings"></div>
            </div>
        </div>

        <!-- ================= FEELINGS - ADD PAGE ================= -->
        <div id="page-add-feeling" class="page">
            <div class="back-btn" onclick="navigate('tab-feelings')">
                <i data-lucide="chevron-left"></i> Back to Feelings
            </div>
            <h2 style="margin-bottom: 20px;">Add a Feeling</h2>
            
            <div class="glass-card">
                <input type="text" id="new-feeling-name" placeholder="Name of feeling (e.g., Nostalgic)">
                <select id="new-feeling-type" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.5); margin-bottom: 15px; font-family: 'Quicksand';">
                    <option value="pleasant">Pleasant</option>
                    <option value="difficult">Difficult</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addFeeling()">Save Feeling</button>
        </div>

        <!-- ================= JOURNAL TAB ================= -->
        <div id="tab-journal" class="page">
            <h1 class="header-title">Journal</h1>
            <p style="margin-bottom: 20px; color: var(--text-light);">Private & Secure.</p>
            <!-- Journal list would go here -->
        </div>

        <!-- ================= SETTINGS TAB ================= -->
        <div id="tab-settings" class="page">
            <h1 class="header-title">Settings</h1>
            
            <div class="glass-card">
                <h3 style="margin-bottom: 15px;">Theme</h3>
                <p style="font-size: 0.9rem; margin-bottom: 10px; color: var(--text-light);">Presets</p>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div onclick="setTheme('#e6e6fa', '#ffd1dc', '#b0e0e6')" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #e6e6fa, #ffd1dc, #b0e0e6); border: 2px solid white; cursor: pointer;"></div>
                    <div onclick="setTheme('#ffebcd', '#f0e68c', '#d3d3d3')" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #ffebcd, #f0e68c, #d3d3d3); border: 2px solid white; cursor: pointer;"></div>
                    <div onclick="setTheme('#c8e6c9', '#b2dfdb', '#e0f2f1')" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #c8e6c9, #b2dfdb, #e0f2f1); border: 2px solid white; cursor: pointer;"></div>
                </div>

                <p style="font-size: 0.9rem; margin-bottom: 10px; color: var(--text-light);">Custom Sliders (Helichrome)</p>
                <input type="range" id="hue-1" min="0" max="360" value="270" oninput="applyCustomTheme()" style="width:100%; margin-bottom: 10px;">
                <input type="range" id="hue-2" min="0" max="360" value="350" oninput="applyCustomTheme()" style="width:100%; margin-bottom: 10px;">
                <input type="range" id="hue-3" min="0" max="360" value="200" oninput="applyCustomTheme()" style="width:100%;">
            </div>
        </div>

    </div>

    <!-- Floating Action Button (Changes based on active tab) -->
    <div class="fab" id="main-fab" onclick="handleFabClick()">
        <i data-lucide="plus" style="width: 28px; height: 28px;"></i>
    </div>

    <!-- Bottom Navigation -->
    <div id="bottom-nav">
        <div class="nav-item active" onclick="navigate('tab-mood')" id="nav-mood">
            <i data-lucide="sun"></i>
            <span>Mood</span>
        </div>
        <div class="nav-item" onclick="navigate('tab-feelings')" id="nav-feelings">
            <i data-lucide="heart"></i>
            <span>Feelings</span>
        </div>
        <div class="nav-item" onclick="navigate('tab-journal')" id="nav-journal">
            <i data-lucide="book-open"></i>
            <span>Journal</span>
        </div>
        <div class="nav-item" onclick="navigate('tab-settings')" id="nav-settings">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Basic Navigation Logic
        let currentTab = 'tab-mood';

        function navigate(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            // Show target page
            document.getElementById(pageId).classList.add('active');
            
            // Update Bottom Nav (Only if it's a main tab)
            if(pageId.startsWith('tab-')) {
                currentTab = pageId;
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                document.getElementById('nav-' + pageId.split('-')[1]).classList.add('active');
                // Show FAB for main tabs
                document.getElementById('main-fab').style.display = 'flex';
            } else {
                // Hide FAB on sub-pages
                document.getElementById('main-fab').style.display = 'none';
            }
        }

        function handleFabClick() {
            if (currentTab === 'tab-mood') {
                navigate('page-log-mood');
            } else if (currentTab === 'tab-feelings') {
                navigate('page-add-feeling');
            }
        }

        // Settings / Theme Logic
        function setTheme(c1, c2, c3) {
            document.documentElement.style.setProperty('--color-1', c1);
            document.documentElement.style.setProperty('--color-2', c2);
            document.documentElement.style.setProperty('--color-3', c3);
        }

        function applyCustomTheme() {
            const h1 = document.getElementById('hue-1').value;
            const h2 = document.getElementById('hue-2').value;
            const h3 = document.getElementById('hue-3').value;
            
            // Use HSL to create beautiful pastel gradients based on hue sliders
            setTheme(`hsl(${h1}, 70%, 85%)`, `hsl(${h2}, 70%, 85%)`, `hsl(${h3}, 70%, 85%)`);
        }

    </script>
</body>
</html>
<script>
    lucide.createIcons();
    let currentTab = 'tab-mood';
    let appData = JSON.parse(localStorage.getItem('ydb_data')) || { moods: [], feelings: [] };

    function saveData() { localStorage.setItem('ydb_data', JSON.stringify(appData)); }

    function navigate(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if(pageId.startsWith('tab-')) {
            currentTab = pageId;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-' + pageId.split('-')[1]).classList.add('active');
            document.getElementById('main-fab').style.display = 'flex';
        } else {
            document.getElementById('main-fab').style.display = 'none';
        }
        renderData();
    }

    function handleFabClick() {
        if (currentTab === 'tab-mood') navigate('page-log-mood');
        else if (currentTab === 'tab-feelings') navigate('page-add-feeling');
    }

    function setTheme(c1, c2, c3) {
        document.documentElement.style.setProperty('--color-1', c1);
        document.documentElement.style.setProperty('--color-2', c2);
        document.documentElement.style.setProperty('--color-3', c3);
    }

    function applyCustomTheme() {
        const h1 = document.getElementById('hue-1').value;
        const h2 = document.getElementById('hue-2').value;
        const h3 = document.getElementById('hue-3').value;
        setTheme(`hsl(${h1}, 70%, 85%)`, `hsl(${h2}, 70%, 85%)`, `hsl(${h3}, 70%, 85%)`);
    }

    // Save Mood Logic
    function saveMood() {
        const note = document.getElementById('mood-note').value;
        if(!note) return;
        appData.moods.unshift({ id: Date.now(), note: note });
        saveData();
        document.getElementById('mood-note').value = '';
        navigate('tab-mood');
    }

    // Add Feeling Logic
    function addFeeling() {
        const name = document.getElementById('new-feeling-name').value;
        const type = document.getElementById('new-feeling-type').value;
        if(!name) return;
        appData.feelings.push({ name, type });
        saveData();
        document.getElementById('new-feeling-name').value = '';
        navigate('tab-feelings');
    }

    // Render Lists
    function renderData() {
        // Render Moods
        const moodContainer = document.getElementById('mood-list-container');
        moodContainer.innerHTML = appData.moods.map(m => `
            <div class="glass-card">
                <p>${m.note}</p>
            </div>
        `).join('');

        // Render Feelings
        const pleasant = appData.feelings.filter(f => f.type === 'pleasant');
        const difficult = appData.feelings.filter(f => f.type === 'difficult');
        
        document.getElementById('pleasant-feelings').innerHTML = pleasant.map(f => `<div class="list-item">${f.name}</div>`).join('');
        document.getElementById('difficult-feelings').innerHTML = difficult.map(f => `<div class="list-item">${f.name}</div>`).join('');
    }

    // Initial Load
    renderData();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
